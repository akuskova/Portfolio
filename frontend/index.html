    <title>Anna Kuskova - Portfolio</title>
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.unregister());
    });
    if (window.caches) {
      caches.keys().then(names => names.forEach(n => caches.delete(n)));
    }
  }
</script>
